# ==============================================================================
# Blackbox Exporter Configuration
# ==============================================================================

modules:
  http_2xx:
    prober: http
    timeout: 900ms
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [200]
      method: GET
      no_follow_redirects: false
      fail_if_ssl: false
      headers:
        User-Agent: "Blackbox-Resilience-Probe/1.0"
