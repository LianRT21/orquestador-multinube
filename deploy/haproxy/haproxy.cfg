# ==============================================================================
# HAProxy 2.x Configuration for Multi-Cloud Resilience Prototyping
# Reverse Proxy de Capa 7 con Runtime API TCP y SIN health checks automáticos
# ==============================================================================

global
    log stdout format raw local0 info
    # Runtime API expuesta en socket TCP para administración remota por orquestador/operador
    stats socket 0.0.0.0:9999 level admin expose-fd listeners
    stats timeout 2m
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    # Timeouts explícitos
    timeout connect 2000ms
    timeout client  5000ms
    timeout server  5000ms
    timeout queue   2000ms

# Frontend público que recibe el tráfico de Locust o de clientes
frontend http_in
    bind *:80
    default_backend app_back

# Frontend de estadísticas y métricas para observabilidad humana y Prometheus
frontend stats_in
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 3s
    stats admin if TRUE

# Backend de capa 7 hacia las instancias de la aplicación en N1 y N2
backend app_back
    mode http
    balance roundrobin

    # Servidor app-a (Nube 1): ACTIVO al inicio
    # CRÍTICO: NO incluye palabra clave 'check' para evitar conmutación no orquestada
    server app-a app-a:8000

    # Servidor app-b (Nube 2): DESHABILITADO / MAINT al inicio
    # CRÍTICO: NO incluye palabra clave 'check'
    server app-b app-b:8000 disabled
