# ==============================================================================
# Prometheus Configuration for Multi-Cloud Resilience Experimentation
# ==============================================================================

global:
  scrape_interval: 1s
  evaluation_interval: 1s
  scrape_timeout: 900ms

scrape_configs:
  # Sondas de la aplicación transaccional en Nube 1 y Nube 2
  - job_name: "reference-apps"
    scrape_interval: 1s
    metrics_path: /metrics
    static_configs:
      - targets: ["app-a:8000"]
        labels:
          cloud: "cloud_a"
          role: "primary"
      - targets: ["app-b:8000"]
        labels:
          cloud: "cloud_b"
          role: "standby"

  # Métricas del motor de decisión del Orquestador
  - job_name: "orchestrator"
    scrape_interval: 1s
    metrics_path: /metrics
    static_configs:
      - targets: ["orchestrator:8080"]
        labels:
          service: "failover-orchestrator"

  # Blackbox Exporter sondeando el Reverse Proxy HAProxy (L7)
  - job_name: "blackbox-proxy"
    scrape_interval: 1s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://haproxy:80/health"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox:9115"

  # Métricas de infraestructura del proxy HAProxy
  - job_name: "haproxy"
    scrape_interval: 2s
    metrics_path: /stats;csv
    static_configs:
      - targets: ["haproxy:8404"]
        labels:
          component: "reverse-proxy"
